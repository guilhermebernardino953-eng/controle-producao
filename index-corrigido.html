<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ProdCtrl · Controle de Produção</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --ink-950:#14201c; --ink-900:#1b2b25; --ink-800:#24382f; --ink-700:#345140;
    --paper:#f6f3ea; --paper-2:#efe9d8; --paper-3:#e6dfc8;
    --line:#8ba38f33; --line-strong:#8ba38f66;
    --amber-500:#d68f2b; --amber-700:#9c651a; --amber-100:#f7e6c4;
    --red-500:#c14e3a; --red-700:#8a3527; --red-100:#f5dcd5;
    --green-500:#4f8f5f; --green-700:#356240; --green-100:#dcecdd;
    --font-display:'Fraunces','Georgia',serif;
    --font-sans:'Inter',system-ui,-apple-system,sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,monospace;
    --radius:10px;
  }
  @font-face{font-family:'Fraunces';src:local('Georgia');}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);font-family:var(--font-sans);color:var(--ink-950);-webkit-font-smoothing:antialiased;}
  #root{min-height:100vh;}
  ::selection{background:var(--amber-100);}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  .app{max-width:1180px;margin:0 auto;padding:20px 20px 80px;}

  /* Header */
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0 18px;border-bottom:2px solid var(--ink-950);margin-bottom:20px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-mark{width:38px;height:38px;border-radius:8px;background:var(--ink-950);display:flex;align-items:center;justify-content:center;color:var(--paper);font-family:var(--font-display);font-weight:700;font-size:18px;flex-shrink:0;}
  .brand-text h1{font-family:var(--font-display);font-size:19px;font-weight:600;margin:0;letter-spacing:-0.01em;}
  .brand-text p{margin:0;font-size:11px;color:var(--ink-700);letter-spacing:0.06em;text-transform:uppercase;font-weight:600;}
  .clock{font-family:var(--font-mono);font-size:13px;color:var(--ink-800);text-align:right;line-height:1.5;}
  .clock b{font-size:15px;display:block;color:var(--ink-950);}

  .nav{display:flex;gap:6px;margin-bottom:22px;flex-wrap:wrap;border-bottom:1px solid var(--line-strong);padding-bottom:0;}
  .nav button{background:none;border:none;padding:10px 16px;font-size:13.5px;font-weight:600;color:var(--ink-700);border-bottom:2.5px solid transparent;margin-bottom:-1px;transition:all .12s;letter-spacing:0.01em;}
  .nav button:hover{color:var(--ink-950);}
  .nav button.active{color:var(--ink-950);border-bottom-color:var(--amber-500);}
  .nav button .badge{display:inline-block;margin-left:6px;background:var(--red-500);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px;vertical-align:middle;}

  /* Cards */
  .panel{background:#fffdf8;border:1px solid var(--line-strong);border-radius:var(--radius);padding:22px;margin-bottom:16px;}
  .panel-tight{padding:16px 18px;}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
  @media(max-width:820px){.grid2,.grid3,.grid4{grid-template-columns:1fr 1fr;}}
  @media(max-width:560px){.grid2,.grid3,.grid4{grid-template-columns:1fr;}}

  .machine-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-bottom:20px;}
  .machine-card{display:flex;flex-direction:column;}
  .machine-card .mini-stops td{border-bottom:1px solid var(--line);}
  .machine-card .mini-stops tr:last-child td{border-bottom:none;}

  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--ink-700);margin-bottom:6px;letter-spacing:0.02em;text-transform:uppercase;}
  .field input,.field select,.field textarea{width:100%;padding:11px 13px;border:1.5px solid var(--line-strong);border-radius:8px;font-size:15px;background:#fff;color:var(--ink-950);transition:border-color .12s;}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--ink-800);}
  .field textarea{resize:vertical;min-height:70px;line-height:1.5;}
  .field .hint{font-size:11.5px;color:var(--ink-700);margin-top:5px;}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:8px;border:1.5px solid var(--ink-950);font-size:14.5px;font-weight:600;background:#fff;color:var(--ink-950);transition:all .12s;white-space:nowrap;}
  .btn:hover{background:var(--paper-3);}
  .btn:active{transform:scale(0.98);}
  .btn-primary{background:var(--ink-950);color:var(--paper);border-color:var(--ink-950);}
  .btn-primary:hover{background:var(--ink-800);}
  .btn-danger{background:var(--red-500);color:#fff;border-color:var(--red-500);}
  .btn-danger:hover{background:var(--red-700);}
  .btn-amber{background:var(--amber-500);color:#fff;border-color:var(--amber-500);}
  .btn-amber:hover{background:var(--amber-700);}
  .btn-block{width:100%;}
  .btn-lg{padding:20px 24px;font-size:17px;border-radius:12px;}
  .btn-sm{padding:7px 12px;font-size:12.5px;border-radius:6px;}
  .btn:disabled{opacity:0.4;cursor:not-allowed;}
  .btn-ghost{border-color:var(--line-strong);background:transparent;}
  .btn-ghost:hover{background:var(--paper-3);}

  .btn-row{display:flex;gap:10px;flex-wrap:wrap;}

  /* Status pill */
  .pill{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:20px;font-size:12px;font-weight:700;letter-spacing:0.02em;}
  .pill-green{background:var(--green-100);color:var(--green-700);}
  .pill-red{background:var(--red-100);color:var(--red-700);}
  .pill-amber{background:var(--amber-100);color:var(--amber-700);}
  .pill-gray{background:var(--paper-3);color:var(--ink-700);}
  .dot{width:7px;height:7px;border-radius:50%;background:currentColor;}
  .dot-pulse{animation:pulse 1.4s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.35;}}

  /* Metric cards */
  .metric{background:var(--paper-2);border-radius:10px;padding:16px;}
  .metric .mlabel{font-size:11.5px;font-weight:600;color:var(--ink-700);text-transform:uppercase;letter-spacing:0.04em;margin-bottom:8px;display:flex;align-items:center;gap:6px;}
  .metric .mvalue{font-family:var(--font-mono);font-size:26px;font-weight:700;color:var(--ink-950);line-height:1.1;}
  .metric.m-red{background:var(--red-100);}
  .metric.m-red .mvalue{color:var(--red-700);}
  .metric.m-green{background:var(--green-100);}
  .metric.m-green .mvalue{color:var(--green-700);}
  .metric.m-amber{background:var(--amber-100);}
  .metric.m-amber .mvalue{color:var(--amber-700);}

  /* Hero start screen */
  .hero-status{text-align:center;padding:30px 20px;}
  .hero-status .big-timer{font-family:var(--font-mono);font-size:52px;font-weight:700;letter-spacing:-0.02em;margin:10px 0;}
  .hero-status .sub{font-size:13px;color:var(--ink-700);}

  /* Table */
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;padding:10px 12px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;color:var(--ink-700);border-bottom:2px solid var(--ink-950);}
  td{padding:11px 12px;border-bottom:1px solid var(--line-strong);vertical-align:top;}
  tr:last-child td{border-bottom:none;}
  tr:hover td{background:var(--paper-2);}
  .desc-cell{max-width:220px;color:var(--ink-800);}
  .empty-row{text-align:center;padding:40px 20px;color:var(--ink-700);}

  /* Section headers */
  .sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
  .sec-head h2{font-family:var(--font-display);font-size:19px;font-weight:600;margin:0;}
  .sec-head .sec-sub{font-size:12.5px;color:var(--ink-700);margin-top:2px;}

  /* Reason chips grid */
  .reason-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:6px;}
  .reason-chip{border:1.5px solid var(--line-strong);border-radius:8px;padding:12px 10px;text-align:center;font-size:13px;font-weight:600;background:#fff;color:var(--ink-800);transition:all .12s;line-height:1.3;}
  .reason-chip:hover{border-color:var(--ink-800);}
  .reason-chip.selected{background:var(--ink-950);border-color:var(--ink-950);color:var(--paper);}

  /* Login */
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .login-card{width:100%;max-width:420px;background:#fffdf8;border:1.5px solid var(--ink-950);border-radius:14px;padding:36px 32px;}
  .login-mark{width:52px;height:52px;border-radius:12px;background:var(--ink-950);display:flex;align-items:center;justify-content:center;color:var(--paper);font-family:var(--font-display);font-weight:700;font-size:24px;margin-bottom:18px;}
  .login-card h1{font-family:var(--font-display);font-size:24px;margin:0 0 4px;font-weight:600;}
  .login-card .sub{font-size:13.5px;color:var(--ink-700);margin-bottom:26px;}

  /* Filters bar */
  .filters-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:flex-end;}
  .filters-bar .field{margin-bottom:0;min-width:150px;flex:1;}

  /* modal */
  .modal-backdrop{position:fixed;inset:0;background:rgba(20,32,28,0.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .modal{background:#fffdf8;border-radius:14px;max-width:640px;width:100%;max-height:88vh;overflow-y:auto;padding:26px;border:1.5px solid var(--ink-950);}
  .modal-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;}
  .modal-head h3{font-family:var(--font-display);font-size:19px;margin:0;font-weight:600;}
  .close-x{background:none;border:none;font-size:20px;color:var(--ink-700);padding:4px;line-height:1;}

  /* signature */
  .sig-box{border:1.5px dashed var(--line-strong);border-radius:8px;background:#fff;touch-action:none;}
  .sig-row{display:flex;justify-content:space-between;align-items:center;margin-top:6px;}

  /* report */
  .report-page{background:#fff;color:#1a1a1a;padding:0;}
  .report-page *{box-sizing:border-box;}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink-950);color:var(--paper);padding:12px 22px;border-radius:10px;font-size:13.5px;font-weight:600;z-index:100;box-shadow:0 8px 24px rgba(0,0,0,0.2);display:flex;align-items:center;gap:8px;}

  .locked-banner{display:flex;align-items:center;gap:10px;background:var(--amber-100);color:var(--amber-700);padding:12px 16px;border-radius:8px;font-size:13px;font-weight:600;margin-bottom:16px;}

  .chart-bars{display:flex;flex-direction:column;gap:10px;}
  .chart-row{display:grid;grid-template-columns:130px 1fr 60px;gap:10px;align-items:center;font-size:13px;}
  .chart-track{height:20px;background:var(--paper-3);border-radius:5px;overflow:hidden;}
  .chart-fill{height:100%;border-radius:5px;background:var(--amber-500);}
  .chart-label{color:var(--ink-800);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .chart-val{font-family:var(--font-mono);font-size:12.5px;color:var(--ink-700);text-align:right;}

  .empty-state{text-align:center;padding:50px 20px;color:var(--ink-700);}
  .empty-state i{font-size:38px;color:var(--line-strong);margin-bottom:12px;display:block;}

  .kv-list{display:flex;flex-direction:column;gap:0;}
  .kv-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
  .kv-row:last-child{border-bottom:none;}
  .kv-row .k{color:var(--ink-700);}
  .kv-row .v{font-weight:600;font-family:var(--font-mono);}

  .checkbox-row{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-800);}
  .checkbox-row input{width:16px;height:16px;}

  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:4px;}

  @media(max-width:600px){
    .app{padding:14px 12px 70px;}
    .topbar{flex-direction:column;align-items:flex-start;}
    .clock{text-align:left;}
    .hero-status .big-timer{font-size:38px;}
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const {useState,useEffect,useRef,useMemo,useCallback} = React;

/* ===================== helpers ===================== */
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
const pad2 = n => String(n).padStart(2,'0');
const todayISO = () => { const d=new Date(); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; };
const fmtDateBR = (iso) => { if(!iso) return ''; const [y,m,d]=iso.split('-'); return `${d}/${m}/${y}`; };
const fmtTime = (ts) => { const d=new Date(ts); return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`; };
const fmtTimeSec = (ts) => { const d=new Date(ts); return `${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`; };
const fmtDur = (ms) => {
  if(ms<0) ms=0;
  const totalSec = Math.floor(ms/1000);
  const h=Math.floor(totalSec/3600), m=Math.floor((totalSec%3600)/60), s=totalSec%60;
  return `${pad2(h)}:${pad2(m)}:${pad2(s)}`;
};
const fmtDurShort = (ms) => {
  if(ms<0) ms=0;
  const totalMin = Math.round(ms/60000);
  const h=Math.floor(totalMin/60), m=totalMin%60;
  if(h>0) return `${h}h ${pad2(m)}min`;
  return `${m} min`;
};
const fmtPct = (v) => `${(v*100).toFixed(1)}%`;
const nowHHMM = () => { const d=new Date(); return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`; };
const combineDateTime = (dateISO, timeHHMM) => {
  if(!dateISO || !timeHHMM) return Date.now();
  const [y,mo,d] = dateISO.split('-').map(Number);
  const [hh,mm] = timeHHMM.split(':').map(Number);
  return new Date(y, (mo||1)-1, d||1, hh||0, mm||0, 0, 0).getTime();
};
const parseShiftHours = (shiftLabel) => {
  const m = shiftLabel && shiftLabel.match(/(\d{2})h-(\d{2})h/);
  if(!m) return null;
  return { start: m[1]+':00', end: m[2]+':00' };
};
const computePlannedEndTs = (dateISO, startHHMM, endHHMM) => {
  if(!endHHMM) return null;
  const startTs = combineDateTime(dateISO, startHHMM);
  let endTs = combineDateTime(dateISO, endHHMM);
  if(endTs <= startTs) endTs += 24*3600*1000; // turno cruza a meia-noite
  return endTs;
};
const resolveActualEndTs = (session, timeHHMM) => {
  const base = new Date();
  const [hh,mm] = (timeHHMM||nowHHMM()).split(':').map(Number);
  let ts = new Date(base.getFullYear(), base.getMonth(), base.getDate(), hh||0, mm||0, 0, 0).getTime();
  if(ts < session.startTs) ts += 24*3600*1000; // fechamento após virar o dia
  return ts;
};

const REASONS = [
  {id:'quebra', label:'Quebra da máquina', icon:'ti-alert-triangle'},
  {id:'manutencao', label:'Manutenção', icon:'ti-tool'},
  {id:'materia_prima', label:'Falta de matéria-prima', icon:'ti-package-off'},
  {id:'falta_operador', label:'Falta de operador', icon:'ti-user-off'},
  {id:'eletrico', label:'Problema elétrico', icon:'ti-bolt-off'},
  {id:'limpeza', label:'Limpeza', icon:'ti-wash'},
  {id:'troca_ferramenta', label:'Troca de ferramenta', icon:'ti-settings'},
  {id:'ajuste', label:'Ajuste da máquina', icon:'ti-adjustments'},
  {id:'qualidade', label:'Problema de qualidade', icon:'ti-shield-x'},
  {id:'outros', label:'Outros', icon:'ti-dots'},
];
const reasonLabel = (id) => REASONS.find(r=>r.id===id)?.label || id;

const DEFAULT_MACHINES = ['Máquina 01','Máquina 02','Máquina 03','Linha de Envase'];
const DEFAULT_SHIFTS = ['1º Turno (06h-14h)','2º Turno (14h-22h)','3º Turno (22h-06h)'];

/* ===================== storage layer ===================== */
async function storeSet(key, value){
  try{ localStorage.setItem(key, JSON.stringify(value)); return true; }
  catch(e){ console.error('storage set fail', key, e); return false; }
}
async function storeGet(key, fallback){
  try{
    const r = localStorage.getItem(key);
    if(r === null) return fallback;
    return JSON.parse(r);
  }catch(e){ return fallback; }
}

/* keys */
const K_CONFIG = 'app:config';
const K_SESSION = 'app:session'; // chave legada (sessão única) — migrada automaticamente
const K_SESSIONS = 'data:active-sessions';
const K_SHIFTS = 'data:shifts';       // finished/active shift records
const K_STOPS = 'data:stops';         // all stop records
const K_MACHINES = 'cfg:machines';
const K_OPERATORS = 'cfg:operators';
const K_USERS = 'cfg:users';
const K_CORRECTIONS = 'data:corrections'; // pending correction requests

/* ===================== Toast ===================== */
function useToast(){
  const [toast,setToast] = useState(null);
  const show = useCallback((msg,icon='ti-check')=>{
    setToast({msg,icon,id:uid()});
  },[]);
  useEffect(()=>{
    if(!toast) return;
    const t = setTimeout(()=>setToast(null), 2600);
    return ()=>clearTimeout(t);
  },[toast]);
  return [toast, show];
}

/* ===================== Signature Pad ===================== */
function SignaturePad({onChange, width=280, height=100, existing}){
  const canvasRef = useRef(null);
  const drawing = useRef(false);
  const hasDrawn = useRef(false);

  useEffect(()=>{
    const c = canvasRef.current;
    const ctx = c.getContext('2d');
    ctx.strokeStyle = '#1b2b25';
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    if(existing){
      const img = new Image();
      img.onload = ()=>{ ctx.drawImage(img,0,0,width,height); hasDrawn.current = true; };
      img.src = existing;
    }
  },[]);

  const getPos = (e) => {
    const rect = canvasRef.current.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: (clientX-rect.left) * (width/rect.width), y: (clientY-rect.top) * (height/rect.height) };
  };

  const start = (e) => {
    e.preventDefault();
    drawing.current = true;
    const ctx = canvasRef.current.getContext('2d');
    const p = getPos(e);
    ctx.beginPath();
    ctx.moveTo(p.x,p.y);
  };
  const move = (e) => {
    if(!drawing.current) return;
    e.preventDefault();
    const ctx = canvasRef.current.getContext('2d');
    const p = getPos(e);
    ctx.lineTo(p.x,p.y);
    ctx.stroke();
    hasDrawn.current = true;
  };
  const end = (e) => {
    if(!drawing.current) return;
    drawing.current = false;
    if(hasDrawn.current && onChange){
      onChange(canvasRef.current.toDataURL('image/png'));
    }
  };
  const clear = () => {
    const ctx = canvasRef.current.getContext('2d');
    ctx.clearRect(0,0,width,height);
    hasDrawn.current = false;
    onChange && onChange(null);
  };

  return (
    <div>
      <canvas
        ref={canvasRef}
        width={width}
        height={height}
        className="sig-box"
        style={{width:'100%',height:height+'px'}}
        onMouseDown={start} onMouseMove={move} onMouseUp={end} onMouseLeave={end}
        onTouchStart={start} onTouchMove={move} onTouchEnd={end}
      />
      <div className="sig-row">
        <span style={{fontSize:'11.5px',color:'var(--ink-700)'}}>Assine no campo acima</span>
        <button type="button" className="btn btn-sm btn-ghost" onClick={clear}>
          <i className="ti ti-eraser" aria-hidden="true"></i> Limpar
        </button>
      </div>
    </div>
  );
}

/* ===================== Login ===================== */
function LoginScreen({users, onLogin, onCreateFirstAdmin}){
  const [mode,setMode] = useState(users.length===0 ? 'setup' : 'login');
  const [name,setName] = useState('');
  const [pin,setPin] = useState('');
  const [role,setRole] = useState('operador');
  const [error,setError] = useState('');

  const doLogin = () => {
    setError('');
    const u = users.find(u=>u.name.toLowerCase()===name.trim().toLowerCase() && u.pin===pin.trim());
    if(!u){ setError('Nome ou PIN incorretos.'); return; }
    onLogin(u);
  };
  const doSetup = () => {
    setError('');
    if(!name.trim()){ setError('Informe seu nome.'); return; }
    if(pin.trim().length<4){ setError('O PIN deve ter ao menos 4 dígitos.'); return; }
    onCreateFirstAdmin({id:uid(), name:name.trim(), pin:pin.trim(), role:'supervisor'});
  };

  return (
    <div className="login-wrap">
      <div className="login-card">
        <div className="login-mark">P</div>
        <h1>ProdCtrl</h1>
        <p className="sub">{mode==='setup' ? 'Configuração inicial · crie o acesso do supervisor' : 'Entre com seu nome e PIN de acesso'}</p>

        <div className="field">
          <label>Nome</label>
          <input placeholder="Seu nome completo" value={name} onChange={e=>setName(e.target.value)} />
        </div>
        <div className="field">
          <label>PIN (4 dígitos ou mais)</label>
          <input type="password" inputMode="numeric" placeholder="••••" value={pin} onChange={e=>setPin(e.target.value)} onKeyDown={e=>e.key==='Enter' && (mode==='setup'?doSetup():doLogin())} />
        </div>

        {error && <div style={{color:'var(--red-700)',fontSize:'13px',fontWeight:600,marginBottom:'12px'}}>
          <i className="ti ti-alert-circle" aria-hidden="true"></i> {error}
        </div>}

        {mode==='setup'
          ? <button className="btn btn-primary btn-block btn-lg" onClick={doSetup}>
              <i className="ti ti-user-plus" aria-hidden="true"></i> Criar acesso de supervisor
            </button>
          : <button className="btn btn-primary btn-block btn-lg" onClick={doLogin}>
              <i className="ti ti-login" aria-hidden="true"></i> Entrar
            </button>
        }

        {mode==='login' && (
          <p style={{fontSize:'12.5px',color:'var(--ink-700)',marginTop:'16px',textAlign:'center'}}>
            Sem acesso cadastrado? Peça ao supervisor em Configurações.
          </p>
        )}
      </div>
    </div>
  );
}

/* ===================== Home / Turno (multi-máquina) ===================== */
function HomeScreen({config, machines, operators, sessions, stops, currentUser, onStart, onConfirmStop, onFinishStop, onFinishShift}){
  const [now, setNow] = useState(Date.now());
  useEffect(()=>{ const t = setInterval(()=>setNow(Date.now()),1000); return ()=>clearInterval(t); },[]);

  const sessionByMachine = useMemo(()=>{
    const m = {};
    sessions.forEach(s=>{ m[s.machine]=s; });
    return m;
  },[sessions]);

  const runningCount = sessions.filter(s=>!s.activeStopId).length;
  const stoppedCount = sessions.filter(s=>s.activeStopId).length;
  const idleCount = Math.max(machines.length - sessions.length, 0);

  if(machines.length===0){
    return (
      <div className="empty-state">
        <i className="ti ti-building-factory-2" aria-hidden="true"></i>
        <p>Cadastre ao menos uma máquina em Configurações para começar a operar.</p>
      </div>
    );
  }

  return (
    <div>
      <div className="grid3" style={{marginBottom:'18px'}}>
        <div className="metric m-green">
          <div className="mlabel"><i className="ti ti-player-play" aria-hidden="true"></i> Em produção</div>
          <div className="mvalue">{runningCount}</div>
        </div>
        <div className="metric m-red">
          <div className="mlabel"><i className="ti ti-hand-stop" aria-hidden="true"></i> Paradas agora</div>
          <div className="mvalue">{stoppedCount}</div>
        </div>
        <div className="metric m-amber">
          <div className="mlabel"><i className="ti ti-power" aria-hidden="true"></i> Sem turno</div>
          <div className="mvalue">{idleCount}</div>
        </div>
      </div>

      <div className="machine-grid">
        {machines.map(m=>(
          <MachineCard
            key={m} machine={m} session={sessionByMachine[m]||null} stops={stops}
            operators={operators} currentUser={currentUser} now={now}
            onStart={onStart} onConfirmStop={onConfirmStop} onFinishStop={onFinishStop} onFinishShift={onFinishShift}
          />
        ))}
      </div>
    </div>
  );
}

/* ===================== Iniciar turno (por máquina) ===================== */
function StartShiftModal({machine, operators, currentUser, onClose, onConfirm}){
  const [shift, setShift] = useState(DEFAULT_SHIFTS[0]);
  const [operator, setOperator] = useState(currentUser && operators.includes(currentUser.name) ? currentUser.name : '');
  const [date, setDate] = useState(todayISO());
  const [startTime, setStartTime] = useState(nowHHMM());
  const [endTime, setEndTime] = useState(()=> (parseShiftHours(DEFAULT_SHIFTS[0])||{}).end || '');
  const [error, setError] = useState('');

  const handleShiftChange = (val) => {
    setShift(val);
    const parsed = parseShiftHours(val);
    if(parsed){ setStartTime(parsed.start); setEndTime(parsed.end); }
  };

  const submit = () => {
    if(!operator){ setError('Selecione o operador.'); return; }
    if(!startTime){ setError('Informe o horário de início.'); return; }
    const startTs = combineDateTime(date, startTime);
    const plannedEndTs = endTime ? computePlannedEndTs(date, startTime, endTime) : null;
    onConfirm({ shift, operator, date, startTs, plannedEndTs });
  };

  return (
    <div className="modal-backdrop" onClick={(e)=>{ if(e.target===e.currentTarget) onClose(); }}>
      <div className="modal">
        <div className="modal-head">
          <div><h3>Iniciar turno</h3><p style={{fontSize:'12.5px',color:'var(--ink-700)',margin:'3px 0 0'}}>{machine}</p></div>
          <button className="close-x" onClick={onClose} aria-label="Fechar"><i className="ti ti-x" aria-hidden="true"></i></button>
        </div>

        <div className="field">
          <label>Turno</label>
          <select value={shift} onChange={e=>handleShiftChange(e.target.value)}>
            {DEFAULT_SHIFTS.map(s=><option key={s} value={s}>{s}</option>)}
          </select>
        </div>
        <div className="field">
          <label>Operador</label>
          <select value={operator} onChange={e=>setOperator(e.target.value)}>
            <option value="">Selecione…</option>
            {operators.map(o=><option key={o} value={o}>{o}</option>)}
          </select>
        </div>
        <div className="grid3">
          <div className="field">
            <label>Data</label>
            <input type="date" value={date} onChange={e=>setDate(e.target.value)} />
          </div>
          <div className="field">
            <label>Início</label>
            <input type="time" value={startTime} onChange={e=>setStartTime(e.target.value)} />
          </div>
          <div className="field">
            <label>Término previsto</label>
            <input type="time" value={endTime} onChange={e=>setEndTime(e.target.value)} />
          </div>
        </div>
        <p style={{fontSize:'11.5px',color:'var(--ink-700)',marginTop:'-8px',marginBottom:'16px'}}>Os horários vêm sugeridos pelo turno escolhido, mas podem ser ajustados livremente.</p>

        {error && <div style={{color:'var(--red-700)',fontSize:'13px',fontWeight:600,marginBottom:'12px'}}><i className="ti ti-alert-circle" aria-hidden="true"></i> {error}</div>}

        <button className="btn btn-primary btn-block btn-lg" onClick={submit}>
          <i className="ti ti-player-play" aria-hidden="true"></i> Iniciar turno
        </button>
      </div>
    </div>
  );
}

/* ===================== Card de máquina ===================== */
function MachineCard({machine, session, stops, operators, currentUser, now, onStart, onConfirmStop, onFinishStop, onFinishShift}){
  const [showStart, setShowStart] = useState(false);
  const [showStop, setShowStop] = useState(false);
  const [showFinish, setShowFinish] = useState(false);

  if(!session){
    return (
      <div className="panel machine-card">
        <div className="sec-head" style={{marginBottom:'10px'}}>
          <h2 style={{fontSize:'16px'}}>{machine}</h2>
          <span className="pill pill-gray"><span className="dot"></span> Sem turno</span>
        </div>
        <button className="btn btn-primary btn-block" onClick={()=>setShowStart(true)}>
          <i className="ti ti-player-play" aria-hidden="true"></i> Iniciar turno
        </button>
        {showStart && (
          <StartShiftModal machine={machine} operators={operators} currentUser={currentUser}
            onClose={()=>setShowStart(false)}
            onConfirm={(payload)=>{ onStart(machine, payload); setShowStart(false); }} />
        )}
      </div>
    );
  }

  const activeStop = session.activeStopId ? stops.find(s=>s.id===session.activeStopId && !s.endTs) : null;
  const sessionStops = stops.filter(s=>s.shiftSessionId===session.id);
  const runningMs = Math.max(now - session.startTs, 0);
  const stoppedMs = sessionStops.reduce((a,s)=>a+((s.endTs||now)-s.startTs),0);
  const workingMs = Math.max(runningMs-stoppedMs,0);
  const overdue = session.plannedEndTs && now > session.plannedEndTs;

  return (
    <div className="panel machine-card">
      <div className="sec-head" style={{marginBottom:'12px'}}>
        <div>
          <h2 style={{fontSize:'16px'}}>{machine}</h2>
          <p className="sec-sub">{session.shift} · {session.operator}</p>
        </div>
        {activeStop
          ? <span className="pill pill-red"><span className="dot dot-pulse"></span> Parada</span>
          : <span className="pill pill-green"><span className="dot"></span> Produzindo</span>
        }
      </div>

      {activeStop ? (
        <div className="hero-status" style={{background:'var(--red-100)',borderRadius:'12px',marginBottom:'14px',padding:'20px'}}>
          <div className="big-timer" style={{color:'var(--red-700)',fontSize:'32px'}}>{fmtDur(now-activeStop.startTs)}</div>
          <p className="sub">Início {fmtTimeSec(activeStop.startTs)} · {reasonLabel(activeStop.reason)}</p>
          <button className="btn btn-danger" style={{marginTop:'10px'}} onClick={()=>onFinishStop(session, activeStop)}>
            <i className="ti ti-player-play" aria-hidden="true"></i> Finalizar parada
          </button>
        </div>
      ) : (
        <div className="hero-status" style={{background:'var(--green-100)',borderRadius:'12px',marginBottom:'14px',padding:'20px'}}>
          <div className="big-timer" style={{color:'var(--green-700)',fontSize:'32px'}}>{fmtDur(workingMs)}</div>
          <p className="sub">Tempo funcionando neste turno</p>
        </div>
      )}

      <div className="grid3" style={{marginBottom:'12px'}}>
        <div className="metric" style={{padding:'10px'}}><div className="mlabel" style={{fontSize:'10.5px'}}>Início</div><div className="mvalue" style={{fontSize:'15px'}}>{fmtTime(session.startTs)}</div></div>
        <div className="metric" style={{padding:'10px'}}><div className="mlabel" style={{fontSize:'10.5px'}}>Previsto</div><div className="mvalue" style={{fontSize:'15px'}}>{session.plannedEndTs?fmtTime(session.plannedEndTs):'—'}</div></div>
        <div className="metric" style={{padding:'10px'}}><div className="mlabel" style={{fontSize:'10.5px'}}>Paradas</div><div className="mvalue" style={{fontSize:'15px'}}>{sessionStops.length}</div></div>
      </div>

      {overdue && !activeStop && (
        <div className="locked-banner" style={{marginBottom:'12px'}}>
          <i className="ti ti-clock-exclamation" aria-hidden="true"></i> Passou do horário previsto de término.
        </div>
      )}

      <div className="btn-row">
        {!activeStop && (
          <button className="btn btn-amber" style={{flex:1}} onClick={()=>setShowStop(true)}>
            <i className="ti ti-hand-stop" aria-hidden="true"></i> Registrar parada
          </button>
        )}
        <button className="btn btn-ghost" style={{flex:1}} onClick={()=>setShowFinish(true)} disabled={!!activeStop}>
          <i className="ti ti-flag-check" aria-hidden="true"></i> Finalizar turno
        </button>
      </div>

      {sessionStops.length>0 && (
        <div className="mini-stops" style={{marginTop:'14px',borderTop:'1px solid var(--line-strong)',paddingTop:'10px'}}>
          <table>
            <tbody>
              {sessionStops.slice().reverse().slice(0,3).map(s=>(
                <tr key={s.id}>
                  <td style={{fontFamily:'var(--font-mono)',fontSize:'12px',padding:'6px 4px'}}>{fmtTime(s.startTs)}</td>
                  <td style={{fontSize:'12px',padding:'6px 4px'}}>{reasonLabel(s.reason)}</td>
                  <td style={{fontFamily:'var(--font-mono)',fontSize:'12px',padding:'6px 4px',textAlign:'right'}}>{s.endTs?fmtDurShort(s.endTs-s.startTs):'em curso'}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}

      {showStop && (
        <StopModal machine={machine} onClose={()=>setShowStop(false)}
          onConfirm={(payload)=>{ onConfirmStop(session, payload); setShowStop(false); }} />
      )}
      {showFinish && (
        <FinishShiftModal session={session} stops={stops} onClose={()=>setShowFinish(false)}
          onConfirm={(sess,endTs)=>{ onFinishShift(sess, endTs); setShowFinish(false); }} />
      )}
    </div>
  );
}

/* ===================== Finalizar turno ===================== */
function FinishShiftModal({session, stops, onClose, onConfirm}){
  const [endTime, setEndTime] = useState(nowHHMM());

  const previewEndTs = resolveActualEndTs(session, endTime);
  const sessionStops = stops.filter(s=>s.shiftSessionId===session.id && s.endTs);
  const stoppedMs = sessionStops.reduce((a,s)=>a+(s.endTs-s.startTs),0);
  const shiftMs = Math.max(previewEndTs - session.startTs, 0);
  const workingMs = Math.max(shiftMs - stoppedMs, 0);

  return (
    <div className="modal-backdrop" onClick={(e)=>{ if(e.target===e.currentTarget) onClose(); }}>
      <div className="modal">
        <div className="modal-head">
          <div><h3>Finalizar turno</h3><p style={{fontSize:'12.5px',color:'var(--ink-700)',margin:'3px 0 0'}}>{session.machine} · {session.operator}</p></div>
          <button className="close-x" onClick={onClose} aria-label="Fechar"><i className="ti ti-x" aria-hidden="true"></i></button>
        </div>

        <div className="field">
          <label>Horário de término</label>
          <input type="time" value={endTime} onChange={e=>setEndTime(e.target.value)} />
        </div>

        <div className="grid3" style={{marginBottom:'18px'}}>
          <div className="metric"><div className="mlabel" style={{fontSize:'10.5px'}}>Turno</div><div className="mvalue" style={{fontSize:'17px'}}>{fmtDur(shiftMs)}</div></div>
          <div className="metric m-green"><div className="mlabel" style={{fontSize:'10.5px'}}>Funcionando</div><div className="mvalue" style={{fontSize:'17px'}}>{fmtDur(workingMs)}</div></div>
          <div className="metric m-red"><div className="mlabel" style={{fontSize:'10.5px'}}>Parado</div><div className="mvalue" style={{fontSize:'17px'}}>{fmtDur(stoppedMs)}</div></div>
        </div>

        <button className="btn btn-primary btn-block btn-lg" onClick={()=>onConfirm(session, previewEndTs)}>
          <i className="ti ti-flag-check" aria-hidden="true"></i> Confirmar finalização
        </button>
      </div>
    </div>
  );
}

/* ===================== Stop Modal ===================== */

  const [notes, setNotes] = useState('');
