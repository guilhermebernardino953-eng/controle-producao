}

/* ===================== Dashboard ===================== */
function Dashboard({stops, machines}){
  const [filterDate, setFilterDate] = useState(todayISO());
  const [filterMachine, setFilterMachine] = useState('todas');

  const dayStops = useMemo(()=> stops.filter(s=>{
    const d = new Date(s.startTs);
    const iso = `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
    if(iso !== filterDate) return false;
    if(filterMachine!=='todas' && s.machine!==filterMachine) return false;
    return true;
  }), [stops, filterDate, filterMachine]);

  const finished = dayStops.filter(s=>s.endTs);
  const totalStopMs = finished.reduce((a,s)=>a+(s.endTs-s.startTs),0);
  const count = finished.length;
  const avgMs = count>0 ? totalStopMs/count : 0;
  const maxStop = finished.slice().sort((a,b)=>(b.endTs-b.startTs)-(a.endTs-a.startTs))[0];

  const byReason = useMemo(()=>{
    const m = {};
    finished.forEach(s=>{ m[s.reason] = (m[s.reason]||0) + (s.endTs-s.startTs); });
    return Object.entries(m).sort((a,b)=>b[1]-a[1]);
  }, [finished]);
  const maxReasonMs = byReason.length ? byReason[0][1] : 1;

  return (
    <div>
      <div className="sec-head">
        <div><h2>Painel do dia</h2><p className="sec-sub">Resumo consolidado das paradas registradas</p></div>
      </div>

      <div className="filters-bar">
        <div className="field">
          <label>Data</label>
          <input type="date" value={filterDate} onChange={e=>setFilterDate(e.target.value)} />
        </div>
        <div className="field">
          <label>Máquina</label>
          <select value={filterMachine} onChange={e=>setFilterMachine(e.target.value)}>
            <option value="todas">Todas as máquinas</option>
            {machines.map(m=><option key={m} value={m}>{m}</option>)}
          </select>
        </div>
      </div>

      <div className="grid4" style={{marginBottom:'16px'}}>
        <div className="metric m-red">
          <div className="mlabel"><i className="ti ti-hand-stop" aria-hidden="true"></i> Tempo total parado</div>
          <div className="mvalue">{fmtDur(totalStopMs)}</div>
        </div>
        <div className="metric m-amber">
          <div className="mlabel"><i className="ti ti-list-details" aria-hidden="true"></i> Qtd. de paradas</div>
          <div className="mvalue">{count}</div>
        </div>
        <div className="metric">
          <div className="mlabel"><i className="ti ti-arrows-diagonal" aria-hidden="true"></i> Maior parada</div>
          <div className="mvalue" style={{fontSize:'20px'}}>{maxStop ? fmtDurShort(maxStop.endTs-maxStop.startTs) : '—'}</div>
        </div>
        <div className="metric">
          <div className="mlabel"><i className="ti ti-chart-bar" aria-hidden="true"></i> Média de duração</div>
          <div className="mvalue" style={{fontSize:'20px'}}>{count ? fmtDurShort(avgMs) : '—'}</div>
        </div>
      </div>

      {byReason.length>0 && (
        <div className="panel">
          <div className="sec-head"><h2 style={{fontSize:'16px'}}>Tempo parado por motivo</h2></div>
          <div className="chart-bars">
            {byReason.map(([rid,ms])=>(
              <div className="chart-row" key={rid}>
                <span className="chart-label">{reasonLabel(rid)}</span>
                <div className="chart-track"><div className="chart-fill" style={{width:`${Math.max((ms/maxReasonMs)*100,3)}%`}}></div></div>
                <span className="chart-val">{fmtDurShort(ms)}</span>
              </div>
            ))}
          </div>
        </div>
      )}

      <div className="panel">
        <div className="sec-head"><h2 style={{fontSize:'16px'}}>Paradas do dia</h2></div>
        {dayStops.length===0 ? (
          <div className="empty-state"><i className="ti ti-calendar-off" aria-hidden="true"></i><p>Nenhuma parada registrada para este filtro.</p></div>
        ) : (
          <table>
            <thead><tr><th>Máquina</th><th>Início</th><th>Fim</th><th>Duração</th><th>Motivo</th><th>Descrição</th></tr></thead>
            <tbody>
              {dayStops.slice().reverse().map(s=>(
                <tr key={s.id}>
                  <td>{s.machine}</td>
                  <td style={{fontFamily:'var(--font-mono)'}}>{fmtTime(s.startTs)}</td>
                  <td style={{fontFamily:'var(--font-mono)'}}>{s.endTs ? fmtTime(s.endTs) : '—'}</td>
                  <td style={{fontFamily:'var(--font-mono)'}}>{s.endTs ? fmtDurShort(s.endTs-s.startTs) : '—'}</td>
                  <td>{reasonLabel(s.reason)}</td>
                  <td className="desc-cell">{s.description}</td>
                </tr>
              ))}
            </tbody>
          </table>
        )}
      </div>
    </div>
  );
}

/* ===================== Indicators ===================== */
function Indicators({stops, shiftsFinished}){
  const [range, setRange] = useState('7');

  const cutoff = Date.now() - Number(range)*86400000;
  const finished = stops.filter(s=>s.endTs && s.startTs>=cutoff);
  const totalStopMs = finished.reduce((a,s)=>a+(s.endTs-s.startTs),0);
  const relevantShifts = shiftsFinished.filter(sh=>sh.endTs && sh.startTs>=cutoff);
  const totalShiftMs = relevantShifts.reduce((a,sh)=>a+(sh.endTs-sh.startTs),0);
  const totalProdMs = Math.max(totalShiftMs - totalStopMs, 0);
  const availability = totalShiftMs>0 ? totalProdMs/totalShiftMs : 0;
  const stopCount = finished.length;
  const mttr = stopCount>0 ? totalStopMs/stopCount : 0;
  const failureIntervals = stopCount>1 ? totalProdMs/stopCount : totalProdMs;
  const mtbf = stopCount>0 ? failureIntervals : totalProdMs;

  const byMachine = useMemo(()=>{
    const m = {};
    finished.forEach(s=>{ m[s.machine] = (m[s.machine]||0)+(s.endTs-s.startTs); });
    return Object.entries(m).sort((a,b)=>b[1]-a[1]);
  },[finished]);
  const maxMachineMs = byMachine.length ? byMachine[0][1] : 1;

  return (
    <div>
      <div className="sec-head">
        <div><h2>Indicadores</h2><p className="sec-sub">Disponibilidade, MTTR, MTBF e ranking de máquinas</p></div>
        <select value={range} onChange={e=>setRange(e.target.value)} style={{width:'auto',padding:'9px 12px',borderRadius:'8px',border:'1.5px solid var(--line-strong)'}}>
          <option value="1">Hoje</option>
          <option value="7">Últimos 7 dias</option>
          <option value="30">Últimos 30 dias</option>
          <option value="365">Últimos 12 meses</option>
        </select>
      </div>

      <div className="grid3" style={{marginBottom:'16px'}}>
        <div className="metric m-green">
          <div className="mlabel"><i className="ti ti-gauge" aria-hidden="true"></i> Disponibilidade</div>
          <div className="mvalue">{relevantShifts.length ? fmtPct(availability) : '—'}</div>
        </div>
        <div className="metric m-amber">
          <div className="mlabel"><i className="ti ti-tool" aria-hidden="true"></i> MTTR (tempo médio p/ reparo)</div>
          <div className="mvalue" style={{fontSize:'20px'}}>{stopCount ? fmtDurShort(mttr) : '—'}</div>
        </div>
        <div className="metric">
          <div className="mlabel"><i className="ti ti-refresh-alert" aria-hidden="true"></i> MTBF (tempo médio entre falhas)</div>
          <div className="mvalue" style={{fontSize:'20px'}}>{stopCount ? fmtDurShort(mtbf) : '—'}</div>
        </div>
      </div>

      <div className="grid3" style={{marginBottom:'16px'}}>
        <div className="metric">
          <div className="mlabel"><i className="ti ti-player-play" aria-hidden="true"></i> Tempo total produção</div>
          <div className="mvalue" style={{fontSize:'20px'}}>{fmtDur(totalProdMs)}</div>
        </div>
        <div className="metric m-red">
          <div className="mlabel"><i className="ti ti-hand-stop" aria-hidden="true"></i> Tempo total parado</div>
          <div className="mvalue" style={{fontSize:'20px'}}>{fmtDur(totalStopMs)}</div>
        </div>
        <div className="metric">
          <div className="mlabel"><i className="ti ti-list-details" aria-hidden="true"></i> Quantidade de paradas</div>
          <div className="mvalue" style={{fontSize:'20px'}}>{stopCount}</div>
        </div>
      </div>

      <div className="panel">
        <div className="sec-head"><h2 style={{fontSize:'16px'}}>Ranking · máquinas com maior tempo parado</h2></div>
        {byMachine.length===0 ? (
          <div className="empty-state"><i className="ti ti-chart-bar-off" aria-hidden="true"></i><p>Sem dados no período selecionado.</p></div>
        ) : (
          <div className="chart-bars">
            {byMachine.map(([mac,ms],i)=>(
              <div className="chart-row" key={mac}>
                <span className="chart-label">{i+1}. {mac}</span>
                <div className="chart-track"><div className="chart-fill" style={{width:`${Math.max((ms/maxMachineMs)*100,3)}%`,background:'var(--red-500)'}}></div></div>
                <span className="chart-val">{fmtDurShort(ms)}</span>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

/* ===================== History ===================== */
function History({stops, shifts, machines, operators, currentUser, onRequestCorrection}){
  const [fDate, setFDate] = useState('');
  const [fMachine, setFMachine] = useState('todas');
  const [fOperator, setFOperator] = useState('todos');
  const [fReason, setFReason] = useState('todos');
  const [openDay, setOpenDay] = useState(null);
  const [editing, setEditing] = useState(null);

  const filtered = useMemo(()=> stops.filter(s=>{
    if(fDate){ const d=new Date(s.startTs); const iso=`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; if(iso!==fDate) return false; }
    if(fMachine!=='todas' && s.machine!==fMachine) return false;
    if(fOperator!=='todos' && s.operator!==fOperator) return false;
    if(fReason!=='todos' && s.reason!==fReason) return false;
    return true;
  }).sort((a,b)=>b.startTs-a.startTs), [stops,fDate,fMachine,fOperator,fReason]);

  const grouped = useMemo(()=>{
    const m = {};
    filtered.forEach(s=>{
      const d = new Date(s.startTs);
      const iso = `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
      (m[iso] = m[iso]||[]).push(s);
    });
    return Object.entries(m).sort((a,b)=>b[0].localeCompare(a[0]));
  },[filtered]);

  return (
    <div>
      <div className="sec-head">
        <div><h2>Histórico</h2><p className="sec-sub">Consulte registros anteriores por data, máquina, operador ou motivo</p></div>
      </div>

      <div className="filters-bar">
        <div className="field"><label>Data</label><input type="date" value={fDate} onChange={e=>setFDate(e.target.value)} /></div>
        <div className="field">
          <label>Máquina</label>
          <select value={fMachine} onChange={e=>setFMachine(e.target.value)}>
            <option value="todas">Todas</option>
            {machines.map(m=><option key={m} value={m}>{m}</option>)}
          </select>
        </div>
        <div className="field">
          <label>Operador</label>
          <select value={fOperator} onChange={e=>setFOperator(e.target.value)}>
            <option value="todos">Todos</option>
            {operators.map(o=><option key={o} value={o}>{o}</option>)}
          </select>
        </div>
        <div className="field">
          <label>Motivo</label>
          <select value={fReason} onChange={e=>setFReason(e.target.value)}>
            <option value="todos">Todos</option>
            {REASONS.map(r=><option key={r.id} value={r.id}>{r.label}</option>)}
          </select>
        </div>
      </div>

      {grouped.length===0 ? (
        <div className="empty-state"><i className="ti ti-history-off" aria-hidden="true"></i><p>Nenhum registro encontrado para os filtros selecionados.</p></div>
      ) : grouped.map(([iso,list])=>{
        const dayTotal = list.reduce((a,s)=>a+(s.endTs?(s.endTs-s.startTs):0),0);
        const isOpen = openDay===iso;
        return (
          <div className="panel panel-tight" key={iso} style={{marginBottom:'10px'}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',cursor:'pointer'}} onClick={()=>setOpenDay(isOpen?null:iso)}>
              <div style={{display:'flex',alignItems:'center',gap:'10px'}}>
                <i className={"ti "+(isOpen?'ti-chevron-down':'ti-chevron-right')} aria-hidden="true"></i>
                <b style={{fontSize:'14.5px'}}>{fmtDateBR(iso)}</b>
                <span className="pill pill-gray">{list.length} parada{list.length!==1?'s':''}</span>
              </div>
              <span style={{fontFamily:'var(--font-mono)',fontSize:'13px',color:'var(--ink-700)'}}>total {fmtDurShort(dayTotal)}</span>
            </div>
            {isOpen && (
              <div style={{marginTop:'14px'}}>
                <table>
                  <thead><tr><th>Máquina</th><th>Início</th><th>Fim</th><th>Duração</th><th>Motivo</th><th>Descrição</th><th>Operador</th><th></th></tr></thead>
                  <tbody>
                    {list.map(s=>(
                      <tr key={s.id}>
                        <td>{s.machine}</td>
                        <td style={{fontFamily:'var(--font-mono)'}}>{fmtTime(s.startTs)}</td>
                        <td style={{fontFamily:'var(--font-mono)'}}>{s.endTs?fmtTime(s.endTs):'—'}</td>
                        <td style={{fontFamily:'var(--font-mono)'}}>{s.endTs?fmtDurShort(s.endTs-s.startTs):'—'}</td>
                        <td>{reasonLabel(s.reason)}{s.corrected && <span className="pill pill-amber" style={{marginLeft:'6px',padding:'1px 7px',fontSize:'10px'}}>editado</span>}</td>
                        <td className="desc-cell">{s.description}</td>
                        <td>{s.operator}</td>
                        <td>
                          <button className="btn btn-sm btn-ghost" onClick={()=>setEditing(s)}>
                            <i className="ti ti-edit" aria-hidden="true"></i>
                          </button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </div>
        );
      })}

      {editing && (
        <CorrectionModal
          stop={editing}
          currentUser={currentUser}
          onClose={()=>setEditing(null)}
          onSubmit={(payload)=>{ onRequestCorrection(editing, payload); setEditing(null); }}
        />
      )}
    </div>
  );
}

function CorrectionModal({stop, currentUser, onClose, onSubmit}){
  const isSupervisor = currentUser?.role === 'supervisor';
  const [description, setDescription] = useState(stop.description);
  const [reason, setReason] = useState(stop.reason);
  const [justification, setJustification] = useState('');
  const [error, setError] = useState('');

  const submit = () => {
    if(!isSupervisor && !justification.trim()){ setError('Descreva o motivo da correção para envio ao supervisor.'); return; }
    onSubmit({description, reason, justification: justification.trim(), applied: isSupervisor});
  };

  return (
    <div className="modal-backdrop" onClick={(e)=>{ if(e.target===e.currentTarget) onClose(); }}>
      <div className="modal">
        <div className="modal-head">
          <h3>Editar registro de parada</h3>
          <button className="close-x" onClick={onClose} aria-label="Fechar"><i className="ti ti-x" aria-hidden="true"></i></button>
        </div>

        {!isSupervisor && (
          <div className="locked-banner">
            <i className="ti ti-lock" aria-hidden="true"></i>
            Alterações de operadores exigem aprovação do supervisor antes de valer.
          </div>
        )}

        <div className="field">
          <label>Descrição</label>
          <textarea value={description} onChange={e=>setDescription(e.target.value)} />
        </div>
        <div className="field">
          <label>Motivo</label>
          <select value={reason} onChange={e=>setReason(e.target.value)}>
            {REASONS.map(r=><option key={r.id} value={r.id}>{r.label}</option>)}
          </select>
        </div>
        {!isSupervisor && (
          <div className="field">
            <label>Justificativa da correção</label>
            <textarea placeholder="Por que este registro precisa ser corrigido?" value={justification} onChange={e=>setJustification(e.target.value)} />
          </div>
        )}
        {error && <div style={{color:'var(--red-700)',fontSize:'13px',fontWeight:600,marginBottom:'12px'}}><i className="ti ti-alert-circle" aria-hidden="true"></i> {error}</div>}

        <button className="btn btn-primary btn-block" onClick={submit}>
          <i className={isSupervisor?'ti ti-check':'ti ti-send'} aria-hidden="true"></i> {isSupervisor ? 'Salvar alteração' : 'Enviar para aprovação'}
        </button>
      </div>
    </div>
  );
}

/* ===================== Report ===================== */
function ReportModal({session, stops, config, onClose, showToast}){
  const relevantStops = stops.filter(s=>s.shiftSessionId===session.id);
  const finished = relevantStops.filter(s=>s.endTs);
  const totalStopMs = finished.reduce((a,s)=>a+(s.endTs-s.startTs),0);
  const shiftMs = (session.endTs||Date.now()) - session.startTs;
  const workingMs = Math.max(shiftMs-totalStopMs,0);

  const [opSig, setOpSig] = useState(null);
  const [supSig, setSupSig] = useState(null);
  const reportRef = useRef(null);

  const generatePDF = () => {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({unit:'pt', format:'a4'});
    const pageW = doc.internal.pageSize.getWidth();
    const margin = 42;
    let y = 50;

    doc.setFont('helvetica','bold'); doc.setFontSize(16);
    doc.text(config.factoryName || 'Relatório de Produção', margin, y); y+=22;
    doc.setFontSize(11); doc.setFont('helvetica','normal');
    doc.text('Relatório diário de produção e paradas', margin, y); y+=26;

    doc.setDrawColor(180); doc.line(margin, y, pageW-margin, y); y+=20;

    const rows = [
      ['Data', fmtDateBR(session.date)],
      ['Turno', session.shift],
      ['Operador', session.operator],
      ['Máquina', session.machine],
      ['Início do turno', fmtTimeSec(session.startTs)],
      ['Término do turno', session.endTs ? fmtTimeSec(session.endTs) : 'Em andamento'],
      ['Tempo total do turno', fmtDur(shiftMs)],
      ['Tempo total funcionando', fmtDur(workingMs)],
      ['Tempo total parado', fmtDur(totalStopMs)],
      ['Quantidade de paradas', String(finished.length)],
    ];
    doc.setFontSize(10.5);
    rows.forEach(([k,v])=>{
      doc.setFont('helvetica','bold'); doc.text(k+':', margin, y);
      doc.setFont('helvetica','normal'); doc.text(String(v), margin+150, y);
      y+=17;
    });

    y += 12;
    doc.setFont('helvetica','bold'); doc.setFontSize(12);
    doc.text('Detalhamento das paradas', margin, y); y+=8;
    doc.setDrawColor(180); doc.line(margin, y, pageW-margin, y); y+=16;

    const colX = [margin, margin+55, margin+100, margin+145, margin+215, margin+340];
    doc.setFontSize(8.5); doc.setFont('helvetica','bold');
    ['Início','Fim','Duração','Motivo','Descrição','Operador'].forEach((h,i)=>doc.text(h, colX[i], y));
    y+=6; doc.setDrawColor(210); doc.line(margin,y,pageW-margin,y); y+=12;

    doc.setFont('helvetica','normal'); doc.setFontSize(8.5);
    if(finished.length===0){
      doc.text('Nenhuma parada registrada neste turno.', margin, y); y+=16;
    }
    finished.forEach(s=>{
      if(y > 760){ doc.addPage(); y=50; }
      doc.text(fmtTime(s.startTs), colX[0], y);
      doc.text(fmtTime(s.endTs), colX[1], y);
      doc.text(fmtDurShort(s.endTs-s.startTs), colX[2], y);
      const reasonTxt = doc.splitTextToSize(reasonLabel(s.reason), 65);
      doc.text(reasonTxt, colX[3], y);
      const descTxt = doc.splitTextToSize(s.description || '-', 115);
      doc.text(descTxt, colX[4], y);
      doc.text(s.operator || session.operator, colX[5], y);
      const lines = Math.max(reasonTxt.length, descTxt.length, 1);
      y += 12*lines + 4;
    });

    y += 20;
    if(y>700){ doc.addPage(); y=60; }
    doc.setDrawColor(150);
    doc.line(margin, y+40, margin+180, y+40);
    doc.line(pageW-margin-180, y+40, pageW-margin, y+40);
    doc.setFontSize(9);
    doc.text('Assinatura do operador', margin, y+52);
    doc.text('Assinatura do supervisor', pageW-margin-180, y+52);

    if(opSig){ try{ doc.addImage(opSig, 'PNG', margin, y-10, 140, 46); }catch(e){} }
    if(supSig){ try{ doc.addImage(supSig, 'PNG', pageW-margin-180, y-10, 140, 46); }catch(e){} }

    doc.setFontSize(8); doc.setTextColor(140);
    doc.text(`Gerado em ${new Date().toLocaleString('pt-BR')} · ProdCtrl`, margin, 820);

    doc.save(`relatorio_${session.machine.replace(/\s+/g,'_')}_${session.date}.pdf`);
    showToast('PDF gerado com sucesso');
  };

  return (
    <div className="modal-backdrop" onClick={(e)=>{ if(e.target===e.currentTarget) onClose(); }}>
      <div className="modal" style={{maxWidth:'720px'}}>
        <div className="modal-head">
          <div><h3>Relatório do turno</h3><p style={{fontSize:'12.5px',color:'var(--ink-700)',margin:'3px 0 0'}}>{session.machine} · {fmtDateBR(session.date)}</p></div>
          <button className="close-x" onClick={onClose} aria-label="Fechar"><i className="ti ti-x" aria-hidden="true"></i></button>
        </div>

        <div ref={reportRef} className="report-page">
          <div className="grid2" style={{marginBottom:'16px'}}>
            <div className="kv-list">
              <div className="kv-row"><span className="k">Fábrica</span><span className="v" style={{fontFamily:'inherit'}}>{config.factoryName}</span></div>
              <div className="kv-row"><span className="k">Turno</span><span className="v" style={{fontFamily:'inherit'}}>{session.shift}</span></div>
              <div className="kv-row"><span className="k">Operador</span><span className="v" style={{fontFamily:'inherit'}}>{session.operator}</span></div>
              <div className="kv-row"><span className="k">Máquina</span><span className="v" style={{fontFamily:'inherit'}}>{session.machine}</span></div>
            </div>
            <div className="kv-list">
              <div className="kv-row"><span className="k">Início do turno</span><span className="v">{fmtTimeSec(session.startTs)}</span></div>
              <div className="kv-row"><span className="k">Término</span><span className="v">{session.endTs?fmtTimeSec(session.endTs):'—'}</span></div>
              <div className="kv-row"><span className="k">Tempo funcionando</span><span className="v">{fmtDur(workingMs)}</span></div>
              <div className="kv-row"><span className="k">Tempo parado</span><span className="v">{fmtDur(totalStopMs)}</span></div>
            </div>
          </div>

          <div className="panel panel-tight" style={{marginBottom:'16px'}}>
            <table>
              <thead><tr><th>Início</th><th>Fim</th><th>Duração</th><th>Motivo</th><th>Descrição</th></tr></thead>
              <tbody>
                {finished.length===0
                  ? <tr><td colSpan="5" className="empty-row">Nenhuma parada registrada.</td></tr>
                  : finished.map(s=>(
                    <tr key={s.id}>
                      <td style={{fontFamily:'var(--font-mono)'}}>{fmtTime(s.startTs)}</td>
                      <td style={{fontFamily:'var(--font-mono)'}}>{fmtTime(s.endTs)}</td>
                      <td style={{fontFamily:'var(--font-mono)'}}>{fmtDurShort(s.endTs-s.startTs)}</td>
                      <td>{reasonLabel(s.reason)}</td>
                      <td className="desc-cell">{s.description}</td>
                    </tr>
                  ))
                }
              </tbody>
            </table>
          </div>

          <div className="grid2">
            <div>
              <p style={{fontSize:'12px',fontWeight:600,color:'var(--ink-700)',marginBottom:'6px'}}>Assinatura do operador</p>
              <SignaturePad onChange={setOpSig} />
            </div>
            <div>
              <p style={{fontSize:'12px',fontWeight:600,color:'var(--ink-700)',marginBottom:'6px'}}>Assinatura do supervisor</p>
              <SignaturePad onChange={setSupSig} />
            </div>
          </div>
        </div>

        <div className="btn-row" style={{marginTop:'18px'}}>
          <button className="btn btn-primary" style={{flex:1}} onClick={generatePDF}>
            <i className="ti ti-file-download" aria-hidden="true"></i> Baixar PDF
          </button>
          <button className="btn btn-ghost" style={{flex:1}} onClick={()=>window.print()}>
            <i className="ti ti-printer" aria-hidden="true"></i> Imprimir
          </button>
          <button className="btn btn-ghost" style={{flex:1}} onClick={()=>{
            if(navigator.share){ navigator.share({title:'Relatório de produção', text:`Relatório ${session.machine} - ${fmtDateBR(session.date)}`}).catch(()=>{}); }
            else showToast('Use "Baixar PDF" e compartilhe o arquivo manualmente','ti-info-circle');
          }}>
            <i className="ti ti-share" aria-hidden="true"></i> Compartilhar
          </button>
        </div>
      </div>
    </div>
  );
}

/* ===================== Settings ===================== */
function Settings({config, setConfig, machines, setMachines, operators, setOperators, users, setUsers, currentUser, corrections, resolveCorrection, stops, setStops}){
  const [newMachine, setNewMachine] = useState('');
  const [newOperator, setNewOperator] = useState('');
  const [newUserName, setNewUserName] = useState('');
  const [newUserPin, setNewUserPin] = useState('');
  const [newUserRole, setNewUserRole] = useState('operador');
  const [factoryName, setFactoryName] = useState(config.factoryName);

  const isSupervisor = currentUser?.role === 'supervisor';

  const addMachine = () => { if(!newMachine.trim()) return; setMachines([...machines, newMachine.trim()]); setNewMachine(''); };
  const removeMachine = (m) => setMachines(machines.filter(x=>x!==m));
  const addOperator = () => { if(!newOperator.trim()) return; setOperators([...operators, newOperator.trim()]); setNewOperator(''); };
  const removeOperator = (o) => setOperators(operators.filter(x=>x!==o));
  const addUser = () => {
    if(!newUserName.trim() || newUserPin.trim().length<4) return;
    setUsers([...users, {id:uid(), name:newUserName.trim(), pin:newUserPin.trim(), role:newUserRole}]);
    setNewUserName(''); setNewUserPin('');
  };
  const removeUser = (id) => setUsers(users.filter(u=>u.id!==id));

  const pendingCorrections = corrections.filter(c=>!c.resolved);

  return (
    <div>
      <div className="sec-head"><div><h2>Configurações</h2><p className="sec-sub">Cadastros e permissões do sistema</p></div></div>

      <div className="panel">
        <h3 style={{fontFamily:'var(--font-display)',fontSize:'16px',margin:'0 0 14px'}}>Dados da fábrica</h3>
        <div className="grid2">
          <div className="field">
            <label>Nome da fábrica</label>
            <input value={factoryName} onChange={e=>setFactoryName(e.target.value)} onBlur={()=>setConfig({...config, factoryName})} disabled={!isSupervisor} />
          </div>
        </div>
      </div>

      {isSupervisor && pendingCorrections.length>0 && (
        <div className="panel">
          <h3 style={{fontFamily:'var(--font-display)',fontSize:'16px',margin:'0 0 14px'}}>
            Correções pendentes <span className="pill pill-amber" style={{marginLeft:'6px'}}>{pendingCorrections.length}</span>
          </h3>
          {pendingCorrections.map(c=>{
            const stop = stops.find(s=>s.id===c.stopId);
            return (
              <div key={c.id} className="panel panel-tight" style={{marginBottom:'10px',background:'var(--paper-2)'}}>
                <p style={{fontSize:'13px',margin:'0 0 6px'}}><b>{stop?.machine}</b> · {stop && fmtDateBR(new Date(stop.startTs).toISOString().slice(0,10))} · solicitado por {c.requestedBy}</p>
                <p style={{fontSize:'13px',color:'var(--ink-700)',margin:'0 0 4px'}}>Justificativa: {c.justification}</p>
                <p style={{fontSize:'12.5px',margin:'0 0 10px'}}>Nova descrição: "{c.payload.description}" · Novo motivo: {reasonLabel(c.payload.reason)}</p>
                <div className="btn-row">
                  <button className="btn btn-sm btn-primary" onClick={()=>resolveCorrection(c,true)}><i className="ti ti-check" aria-hidden="true"></i> Aprovar</button>
                  <button className="btn btn-sm btn-ghost" onClick={()=>resolveCorrection(c,false)}><i className="ti ti-x" aria-hidden="true"></i> Rejeitar</button>
                </div>
              </div>
            );
          })}
        </div>
      )}

      <div className="grid2">
        <div className="panel">
          <h3 style={{fontFamily:'var(--font-display)',fontSize:'16px',margin:'0 0 14px'}}>Máquinas</h3>
          {isSupervisor && (
            <div className="btn-row" style={{marginBottom:'12px'}}>
              <input placeholder="Nome da máquina" value={newMachine} onChange={e=>setNewMachine(e.target.value)} style={{flex:1,padding:'9px 12px',borderRadius:'8px',border:'1.5px solid var(--line-strong)'}} onKeyDown={e=>e.key==='Enter'&&addMachine()} />
              <button className="btn btn-sm btn-primary" onClick={addMachine}><i className="ti ti-plus" aria-hidden="true"></i></button>
            </div>
          )}
          {machines.map(m=>(
            <div key={m} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'8px 0',borderBottom:'1px solid var(--line)'}}>
              <span style={{fontSize:'13.5px'}}>{m}</span>
              {isSupervisor && <button className="btn btn-sm btn-ghost" onClick={()=>removeMachine(m)}><i className="ti ti-trash" aria-hidden="true"></i></button>}
            </div>
          ))}
        </div>

        <div className="panel">
          <h3 style={{fontFamily:'var(--font-display)',fontSize:'16px',margin:'0 0 14px'}}>Operadores</h3>
          {isSupervisor && (
            <div className="btn-row" style={{marginBottom:'12px'}}>
              <input placeholder="Nome do operador" value={newOperator} onChange={e=>setNewOperator(e.target.value)} style={{flex:1,padding:'9px 12px',borderRadius:'8px',border:'1.5px solid var(--line-strong)'}} onKeyDown={e=>e.key==='Enter'&&addOperator()} />
              <button className="btn btn-sm btn-primary" onClick={addOperator}><i className="ti ti-plus" aria-hidden="true"></i></button>
            </div>
          )}
          {operators.map(o=>(
            <div key={o} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'8px 0',borderBottom:'1px solid var(--line)'}}>
              <span style={{fontSize:'13.5px'}}>{o}</span>
              {isSupervisor && <button className="btn btn-sm btn-ghost" onClick={()=>removeOperator(o)}><i className="ti ti-trash" aria-hidden="true"></i></button>}
            </div>
          ))}
        </div>
      </div>

      {isSupervisor && (
        <div className="panel">
          <h3 style={{fontFamily:'var(--font-display)',fontSize:'16px',margin:'0 0 14px'}}>Usuários e permissões</h3>
          <div className="grid3" style={{marginBottom:'14px'}}>
            <input placeholder="Nome" value={newUserName} onChange={e=>setNewUserName(e.target.value)} style={{padding:'9px 12px',borderRadius:'8px',border:'1.5px solid var(--line-strong)'}} />
            <input placeholder="PIN (4+ dígitos)" value={newUserPin} onChange={e=>setNewUserPin(e.target.value)} style={{padding:'9px 12px',borderRadius:'8px',border:'1.5px solid var(--line-strong)'}} />
            <select value={newUserRole} onChange={e=>setNewUserRole(e.target.value)} style={{padding:'9px 12px',borderRadius:'8px',border:'1.5px solid var(--line-strong)'}}>
              <option value="operador">Operador</option>
              <option value="supervisor">Supervisor</option>
            </select>
          </div>
          <button className="btn btn-sm btn-primary" onClick={addUser} style={{marginBottom:'16px'}}><i className="ti ti-user-plus" aria-hidden="true"></i> Adicionar usuário</button>
          {users.map(u=>(
            <div key={u.id} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'9px 0',borderBottom:'1px solid var(--line)'}}>
              <div>
                <span style={{fontSize:'13.5px',fontWeight:600}}>{u.name}</span>
                <span className={"pill "+(u.role==='supervisor'?'pill-amber':'pill-gray')} style={{marginLeft:'8px',padding:'2px 9px'}}>{u.role==='supervisor'?'Supervisor':'Operador'}</span>
              </div>
              {u.id!==currentUser.id && <button className="btn btn-sm btn-ghost" onClick={()=>removeUser(u.id)}><i className="ti ti-trash" aria-hidden="true"></i></button>}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* ===================== App ===================== */
function App(){
  const [loading, setLoading] = useState(true);
  const [tab, setTab] = useState('home');
  const [currentUser, setCurrentUser] = useState(null);
  const [toast, showToast] = useToast();

  const [config, setConfigState] = useState({factoryName:'Minha Fábrica'});
  const [users, setUsersState] = useState([]);
  const [machines, setMachinesState] = useState(DEFAULT_MACHINES);
  const [operators, setOperatorsState] = useState([]);
  const [sessions, setSessionsState] = useState([]);
  const [pastShifts, setPastShifts] = useState([]);
  const [stops, setStopsState] = useState([]);
  const [corrections, setCorrectionsState] = useState([]);

  const [reportSession, setReportSession] = useState(null);

  /* ---- load ---- */
  useEffect(()=>{
    (async ()=>{
      const [cfg,us,ms,ops,sessArr,legacySess,shs,st,cor] = await Promise.all([
        storeGet(K_CONFIG, {factoryName:'Minha Fábrica'}),
        storeGet(K_USERS, []),
        storeGet(K_MACHINES, DEFAULT_MACHINES),
        storeGet(K_OPERATORS, []),
        storeGet(K_SESSIONS, null),
        storeGet(K_SESSION, null),
        storeGet(K_SHIFTS, []),
        storeGet(K_STOPS, []),
        storeGet(K_CORRECTIONS, []),
      ]);
      // migração: versões antigas guardavam apenas uma sessão ativa por vez
      let initialSessions = sessArr;
      if(!initialSessions){
        initialSessions = legacySess ? [{...legacySess, plannedEndTs: legacySess.plannedEndTs||null}] : [];
      }
      setConfigState(cfg); setUsersState(us); setMachinesState(ms); setOperatorsState(ops);
      setSessionsState(initialSessions); setPastShifts(shs); setStopsState(st); setCorrectionsState(cor);
      setLoading(false);
    })();
  },[]);

  /* ---- persistence setters ---- */
  const setConfig = (v) => { setConfigState(v); storeSet(K_CONFIG, v); };
  const setUsers = (v) => { setUsersState(v); storeSet(K_USERS, v); };
  const setMachines = (v) => { setMachinesState(v); storeSet(K_MACHINES, v); };
  const setOperators = (v) => { setOperatorsState(v); storeSet(K_OPERATORS, v); };
  const setStops = (v) => { setStopsState(v); storeSet(K_STOPS, v); };
  const setCorrections = (v) => { setCorrectionsState(v); storeSet(K_CORRECTIONS, v); };
  const setSessions = (v) => { setSessionsState(v); storeSet(K_SESSIONS, v); };

  const handleLogin = (u) => { setCurrentUser(u); };
  const handleCreateFirstAdmin = (u) => {
    const list = [u];
    setUsers(list);
    setCurrentUser(u);
  };

  const handleStartShift = (machine, payload) => {
    const newSession = {
      id: uid(), machine, shift: payload.shift, operator: payload.operator,
      date: payload.date, startTs: payload.startTs, plannedEndTs: payload.plannedEndTs,
      endTs: null, activeStopId: null,
    };
    setSessions([...sessions, newSession]);
    showToast(`Turno iniciado em ${machine}`,'ti-player-play');
  };

  const handleConfirmStop = (session, payload) => {
    const stop = {
      id: uid(), shiftSessionId: session.id, machine: session.machine, operator: session.operator,
      startTs: Date.now(), endTs: null, description: payload.description, reason: payload.reason, notes: payload.notes,
    };
    setStops([...stops, stop]);
    setSessions(sessions.map(s=> s.id===session.id ? {...s, activeStopId: stop.id} : s));
    showToast('Parada iniciada','ti-player-stop');
  };

  const handleFinishStopForSession = (session, stop) => {
    setStops(stops.map(s=> s.id===stop.id ? {...s, endTs: Date.now()} : s));
    setSessions(sessions.map(s=> s.id===session.id ? {...s, activeStopId: null} : s));
    showToast(`Parada finalizada · ${fmtDurShort(Date.now()-stop.startTs)}`,'ti-player-play');
  };

  const handleFinishShift = (session, endTs) => {
    const archived = {...session, endTs, status:'finished'};
    setSessions(sessions.filter(s=>s.id!==session.id));
    const updatedPast = [...pastShifts, archived];
    setPastShifts(updatedPast);
    storeSet(K_SHIFTS, updatedPast);
    setReportSession(archived);
    showToast('Turno finalizado','ti-flag-check');
  };

  const handleRequestCorrection = (stop, payload) => {
    if(payload.applied){
      // supervisor direct edit
      const updated = stops.map(s=> s.id===stop.id ? {...s, description:payload.description, reason:payload.reason, corrected:true} : s);
      setStops(updated);
      showToast('Registro atualizado');
    } else {
      const correction = { id:uid(), stopId:stop.id, payload:{description:payload.description, reason:payload.reason}, justification:payload.justification, requestedBy:currentUser.name, resolved:false };
      const updated = [...corrections, correction];
      setCorrections(updated);
      showToast('Correção enviada para aprovação do supervisor','ti-send');
    }
  };
  const resolveCorrection = (correction, approve) => {
    if(approve){
      const updated = stops.map(s=> s.id===correction.stopId ? {...s, description:correction.payload.description, reason:correction.payload.reason, corrected:true} : s);
      setStops(updated);
    }
    const updatedCor = corrections.map(c=> c.id===correction.id ? {...c, resolved:true, approved:approve} : c);
    setCorrections(updatedCor);
    showToast(approve?'Correção aprovada':'Correção rejeitada');
  };

  const [now,setNow] = useState(Date.now());
  useEffect(()=>{ const t=setInterval(()=>setNow(Date.now()),1000); return ()=>clearInterval(t); },[]);

  const pendingCorrCount = corrections.filter(c=>!c.resolved).length;

  if(loading){
    return <div style={{display:'flex',alignItems:'center',justifyContent:'center',minHeight:'50vh',color:'var(--ink-700)',fontSize:'14px'}}>Carregando…</div>;
  }

  if(!currentUser){
    return <LoginScreen users={users} onLogin={handleLogin} onCreateFirstAdmin={handleCreateFirstAdmin} />;
  }

  const allStopsForReports = [...stops];

  return (
    <div className="app">
      <div className="topbar">
        <div className="brand">
          <div className="brand-mark">P</div>
          <div className="brand-text">
            <h1>{config.factoryName}</h1>
            <p>ProdCtrl · Controle de produção</p>
          </div>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:'16px'}}>
          <div className="clock">
            <b>{new Date(now).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}</b>
            {fmtDateBR(todayISO())} · {currentUser.name}
          </div>
          <button className="btn btn-sm btn-ghost" onClick={()=>setCurrentUser(null)} aria-label="Sair">
            <i className="ti ti-logout" aria-hidden="true"></i>
          </button>
        </div>
      </div>

      <div className="nav">
        <button className={tab==='home'?'active':''} onClick={()=>setTab('home')}><i className="ti ti-home" aria-hidden="true"></i> Início</button>
        <button className={tab==='dashboard'?'active':''} onClick={()=>setTab('dashboard')}><i className="ti ti-layout-dashboard" aria-hidden="true"></i> Painel</button>
        <button className={tab==='indicators'?'active':''} onClick={()=>setTab('indicators')}><i className="ti ti-chart-line" aria-hidden="true"></i> Indicadores</button>
        <button className={tab==='history'?'active':''} onClick={()=>setTab('history')}><i className="ti ti-history" aria-hidden="true"></i> Histórico</button>
        <button className={tab==='reports'?'active':''} onClick={()=>setTab('reports')}><i className="ti ti-file-report" aria-hidden="true"></i> Relatórios</button>
        <button className={tab==='settings'?'active':''} onClick={()=>setTab('settings')}>
          <i className="ti ti-settings" aria-hidden="true"></i> Configurações
          {currentUser.role==='supervisor' && pendingCorrCount>0 && <span className="badge">{pendingCorrCount}</span>}
        </button>
      </div>

      {tab==='home' && (
        <HomeScreen
          config={config} machines={machines} operators={operators}
          sessions={sessions} stops={stops} currentUser={currentUser}
          onStart={handleStartShift} onConfirmStop={handleConfirmStop}
          onFinishStop={handleFinishStopForSession} onFinishShift={handleFinishShift}
        />
      )}
      {tab==='dashboard' && <Dashboard stops={stops} machines={machines} />}
      {tab==='indicators' && <Indicators stops={stops} shiftsFinished={pastShifts} />}
      {tab==='history' && (
        <History stops={stops} shifts={pastShifts} machines={machines} operators={operators} currentUser={currentUser} onRequestCorrection={handleRequestCorrection} />
      )}
      {tab==='reports' && (
        <div>
          <div className="sec-head"><div><h2>Relatórios</h2><p className="sec-sub">Gere relatórios de turnos finalizados prontos para impressão</p></div></div>
          {pastShifts.length===0 ? (
            <div className="empty-state"><i className="ti ti-file-off" aria-hidden="true"></i><p>Nenhum turno finalizado ainda. Finalize um turno para gerar relatórios.</p></div>
          ) : (
            <div className="panel">
              <table>
                <thead><tr><th>Data</th><th>Turno</th><th>Máquina</th><th>Operador</th><th>Duração</th><th></th></tr></thead>
                <tbody>
                  {pastShifts.slice().reverse().map(sh=>(
                    <tr key={sh.id}>
                      <td>{fmtDateBR(sh.date)}</td>
                      <td>{sh.shift}</td>
                      <td>{sh.machine}</td>
                      <td>{sh.operator}</td>
                      <td style={{fontFamily:'var(--font-mono)'}}>{fmtDur((sh.endTs||now)-sh.startTs)}</td>
                      <td>
                        <button className="btn btn-sm btn-primary" onClick={()=>setReportSession(sh)}>
                          <i className="ti ti-file-report" aria-hidden="true"></i> Gerar relatório
                        </button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
        </div>
      )}
      {tab==='settings' && (
        <Settings
          config={config} setConfig={setConfig}
          machines={machines} setMachines={setMachines}
          operators={operators} setOperators={setOperators}
          users={users} setUsers={setUsers}
          currentUser={currentUser}
          corrections={corrections} resolveCorrection={resolveCorrection}
          stops={stops} setStops={setStops}
        />
      )}

      {reportSession && (
        <ReportModal session={reportSession} stops={allStopsForReports} config={config} onClose={()=>setReportSession(null)} showToast={showToast} />
      )}

      {toast && (
        <div className="toast">
          <i className={"ti "+toast.icon} aria-hidden="true"></i> {toast.msg}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
